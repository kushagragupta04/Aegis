services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: aegis_postgres
    environment:
      POSTGRES_DB: aegis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/src/db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aegis"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aegis_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: aegis_server
    env_file:
      - ./server/.env
    environment:
      # PORT is set explicitly (matching the healthcheck/port-mapping below) so
      # this doesn't silently depend on whatever (gitignored) server/.env has.
      PORT: 3000
      DATABASE_URL: postgresql://postgres:password@aegis_postgres:5432/aegis
      REDIS_URL: redis://aegis_redis:6379
      FRONTEND_URL: http://localhost:5173
    volumes:
      # Mount source code so HMR/nodemon works while running in Docker
      - ./server/src:/app/src
      - server_uploads:/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: aegis_client
    env_file:
      - ./client/.env
    environment:
      VITE_API_PROXY_TARGET: http://server:3000
      VITE_API_URL: http://localhost:3000
      VITE_SOCKET_URL: http://localhost:3000
    ports:
      - "5173:5173"
    volumes:
      # Mount source code so HMR works while running in Docker
      - ./client/src:/usr/src/app/src
      # Protect the container's node_modules from being overwritten by the host mount
      - /usr/src/app/node_modules
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: aegis_adminer
    restart: always
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
  server_uploads:
